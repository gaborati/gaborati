
name: Update LeetCode Stats
 
on:
  schedule:
    # Runs every day at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch: {} # allows manual runs from the GitHub Actions tab
 
permissions:
  contents: write
 
jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
 
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
 
      - name: Fetch stats and update README
        env:
          LEETCODE_USERNAME: aaa96
        run: node .github/workflows/scripts/updateLeetcode.js
 
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: update LeetCode stats"
          git push
 
